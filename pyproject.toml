[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openalex-metrics"
version = "0.1.0"
description = "Field-normalised citation impact (MNCS, PP top 10%) for any set of OpenAlex works"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gael Bernard", email = "gael.bernard@epfl.ch" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "duckdb>=1.2",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Step 1 of a build reads the OpenAlex snapshot. Download-only use does not need it.
build = ["pyarrow>=14"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/epfl-p-data/OpenAlexImpactMetrics"
Repository = "https://github.com/epfl-p-data/OpenAlexImpactMetrics"
Issues = "https://github.com/epfl-p-data/OpenAlexImpactMetrics/issues"

[tool.setuptools]
packages = ["oam"]

[tool.setuptools.package-data]
oam = ["LICENSE-OpenAlex.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
